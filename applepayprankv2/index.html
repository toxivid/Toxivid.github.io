```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Prevent mobile zooming -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Take 50 Dollars</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    .container {
      width: 100%;
      text-align: center;
      padding: 20px;
    }

    #takeButton {
      width: min(55vw, 200px);
      height: min(55vw, 200px);

      border: none;
      border-radius: 50%;

      background: #e53935;
      color: white;

      font-size: clamp(18px, 5vw, 24px);
      font-weight: 700;

      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.45),
        inset 0 -5px 0 rgba(0, 0, 0, 0.15);

      transition:
        transform 0.08s ease,
        background 0.08s ease;
    }

    #takeButton:active {
      transform: scale(0.93);
      background: #c62828;
    }

    #result {
      display: none;

      margin: 28px auto 0;
      width: fit-content;

      padding: 16px 28px;

      border-radius: 16px;

      background: #222;
      color: #4cff7a;

      font-size: clamp(24px, 7vw, 34px);
      font-weight: 800;

      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);

      animation: pop 0.2s ease-out;
    }

    @keyframes pop {
      0% {
        transform: scale(0.75);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <button id="takeButton" type="button">
      Take 50 dollars
    </button>

    <div id="result">+$50</div>

  </div>

  <audio
    id="audio"
    preload="auto"
    playsinline
  >
    <source
      src="https://raw.githubusercontent.com/toxivid/-/main/applepay.mp3"
      type="audio/mpeg"
    >
  </audio>

  <script>
    const button = document.getElementById("takeButton");
    const audio = document.getElementById("audio");
    const result = document.getElementById("result");

    let total = 0;
    let lastPress = 0;

    function takeMoney(event) {
      event.preventDefault();

      // Prevent accidental duplicate events on mobile
      const now = Date.now();

      if (now - lastPress < 80) {
        return;
      }

      lastPress = now;

      // Add $50
      total += 50;

      // Update UI immediately
      result.textContent = `+$${total}`;
      result.style.display = "block";

      // Restart the sound every press
      audio.pause();
      audio.currentTime = 0;

      const playPromise = audio.play();

      // Some mobile browsers reject play() occasionally.
      // Try loading the audio and playing it again.
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          audio.load();

          audio.play().catch(() => {
            // Browser still refused playback.
            // Nothing else is needed; the next user press will try again.
          });
        });
      }
    }

    // Pointer events work better across modern phones,
    // tablets and desktop browsers.
    button.addEventListener("pointerup", takeMoney);

    // Prevent long-press context menus on mobile.
    button.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });
  </script>

</body>
</html>
